[package]
name = "deepsea-harness"
version = "0.1.0"
description = "DeepSeek-powered desktop coding workspace"
authors = ["DeepSea Harness contributors"]
edition = "2021"
[lib]
name = "deepsea_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"